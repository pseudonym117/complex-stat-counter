syntax = "proto3";

package com.pseudo.statcounter.proto;

option java_package = "com.pseudo.statcounter.proto";
option java_multiple_files = true;

message Participant {
  string name = 1;
  bool some_boolean_thing = 2;
  int32 some_int_thing = 3;
}

message Stat {
  string name = 1;
  oneof stat_type {
    int64 sum = 2;
    int64 count = 3;
  }
}

message StatMapping {
  Stat stat = 1;
  string field_name = 2;
}

message Configuration {
  repeated Participant participants = 1;
  repeated StatMapping desired_stats = 2;
}
